<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>디지털단지 구내식당 오늘 메뉴</title>
  <meta name="description" content="가산디지털단지와 구로디지털단지 구내식당 오늘 메뉴를 지역별로 확인하세요.">
  <meta name="robots" content="index,follow">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f7fb;color:#172033;font-family:"Segoe UI","Malgun Gothic",sans-serif}
    main{width:min(780px,100%)}h1{text-align:center;font-size:clamp(28px,6vw,44px);margin:0 0 10px}p{text-align:center;color:#607089;margin:0 0 28px}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{display:block;padding:30px;border:1px solid #dfe7f3;border-radius:24px;background:#fff;color:inherit;text-decoration:none;box-shadow:0 18px 44px rgba(25,44,87,.08);transition:.18s}
    .card:hover{transform:translateY(-3px);box-shadow:0 22px 54px rgba(25,44,87,.14)}.card strong{display:block;font-size:25px;margin-bottom:8px}.card span{color:#607089;line-height:1.6}.gasan{border-top:6px solid #2f67ff}.guro{border-top:6px solid #16836e}
    @media(max-width:620px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <h1>디지털단지 구내식당 오늘 메뉴</h1>
  <p>확인할 지역을 선택하세요.</p>
  <div class="grid">
    <a class="card gasan" href="./menu-today/"><strong>가산디지털단지</strong><span>가산 구내식당 메뉴 모음 보기</span></a>
    <a class="card guro" href="./guro-menu/"><strong>구로디지털단지</strong><span>구디 구내식당 메뉴 모음 보기</span></a>
  </div>
</main>
</body>
</html>
